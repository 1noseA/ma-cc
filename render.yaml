services:
  - type: web
    name: ma-cc
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ma-cc-db
          property: connectionString

databases:
  - name: ma-cc-db
    databaseName: ma_cc_production
    user: ma_cc
